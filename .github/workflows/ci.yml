name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn[standard] \
            rasterio pyproj shapely numpy \
            pystac-client planetary-computer \
            rio-tiler rio-cogeo \
            loguru pydantic-settings python-dotenv python-multipart \
            pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
